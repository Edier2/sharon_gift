<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi noviesita hermosa</title>
    <!-- Importar Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importar fuente pixelada de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden; /* Evitar scroll */
            user-select: none;
        }

        /* Estilo de caja de texto Undertale */
        .ut-box {
            border: 4px solid #fff;
            background-color: #000;
            padding: 1.5rem;
            border-radius: 1px; /* Ligeramente redondeado */
            position: relative;
        }

        /* Input estilo Deltarune */
        .retro-input {
            background: transparent;
            border: none;
            border-bottom: 4px solid #fff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            font-size: 1.5rem;
            outline: none;
            padding: 10px;
            text-transform: uppercase;
            width: 100%;
            max-width: 400px;
        }

        .retro-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .retro-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Animaciones de desvanecimiento */
        .fade-in { animation: fadeIn 1.5s forwards; }
        .fade-out { animation: fadeOut 1.5s forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; display: none; }
        }

        /* Pantallas ocultas por defecto */
        .screen {
            display: none;
            opacity: 0;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .active-screen {
            display: flex;
            opacity: 1;
        }

        /* Contenedor de la foto con brillo dinámico */
        .photo-container {
            width: 250px;
            height: 250px;
            border: 4px solid #fff;
            margin-bottom: 20px;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.6rem;
            line-height: 1.5;
            transition: box-shadow 1s ease;
            background-size: cover;
            background-position: center;
        }

        /* Animación del cursor de escritura */
        .cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        
        /* Ajuste de texto para pantallas pequeñas */
        @media (max-width: 640px) {
            .ut-box { font-size: 0.7rem; line-height: 1.5; padding: 1rem; }
            .retro-input { font-size: 1rem; }
            .photo-container { width: 180px; height: 180px; }
        }
      /* Efecto de estática de TV agresivo */
        .tv-static {
            background: repeating-radial-gradient(#000 0 0.0001%,#fff 0 0.0002%) 50% 0/2500px 2500px,
                        repeating-conic-gradient(#000 0 0.0001%,#fff 0 0.0002%) 50% 50%/2500px 2500px;
            background-blend-mode: difference;
            animation: staticAnim 0.1s infinite alternate;
            opacity: 0.7;
            mix-blend-mode: screen; 
        }
        @keyframes staticAnim {
            100% { background-position: 50% 0, 60% 50%; }
        }

        /* --- NUEVO: ANIMACIONES ÉPICAS --- */
        .spin-container { animation: spinAround 6s linear infinite; }
        .counter-spin { animation: counterSpin 6s linear infinite; }
        
        @keyframes spinAround { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        @keyframes counterSpin { 
            from { transform: translate(-50%, -50%) rotate(0deg); } 
            to { transform: translate(-50%, -50%) rotate(-360deg); } 
        }

        @keyframes fastBlink {
            0%, 100% { opacity: 1; transform: scale(1.5) translate(-33%, -33%); filter: drop-shadow(0 0 20px red); }
            50% { opacity: 0.2; transform: scale(1.2) translate(-40%, -40%); filter: drop-shadow(0 0 5px red); }
        }
        .soul-blink { animation: fastBlink 0.2s infinite; }

        /* Destello blanco para la transición final */
        .white-flash {
            background-color: white;
            z-index: 100;
            opacity: 1 !important;
            transition: opacity 1s ease-out;
        }
    </style>
</head>

        function initAudio() {
            if (!audioCtx) {

            }
            if (audioCtx.state === 'suspended') {

            }

        function playBlip() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

       function playStaticSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.5; // Aumentado a 0.5 segundos
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1; 
            }
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            const gainNode = audioCtx.createGain();
            
            // Volumen subido a 0.6 (¡mucho más agresivo!)
            gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            noiseSource.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            noiseSource.start();
            noiseSource.stop(audioCtx.currentTime + 0.5);
        }

    

       function typeWriter(elementId, text, speed, onComplete) {
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            let i = 0;
            isTyping = true;

            function type() {
                if (!isTyping) return; 
                
                if (i < text.length) {
                    if (text.charAt(i) === '\n') {
                        element.innerHTML += "<br>";
                    } else {
                        element.innerHTML += text.charAt(i);
                        if (i % 2 === 0 && text.charAt(i) !== ' ') {
                            playBlip();
                        }
                    }
                    i++;
                    typingTimeout = setTimeout(type, speed);
                } else {
                    finishTyping();
                }
            }
            type();
        }

            if (typingCallback) {

            }

            } else {
                imgContainerEl.style.backgroundImage = "none";
                placeholderText.style.display = "block";
                placeholderText.style.color = soul.color;
            }

            btnNext.classList.add('hidden');
            document.getElementById('soul-text').innerText = ""; 

            typeWriter('soul-text', soul.text, 50, () => {
                btnNext.classList.remove('hidden');
                currentSoulIndex++;
            });
        }

       document.getElementById('btnNext-Soul').addEventListener('click', () => {
            if (isTyping) {
                finishTyping();
                return;
            }
            
            // ... (aquí sigue el resto de tu código de estática y transición épica que ya tenías)
            document.getElementById('btnNext-Soul').classList.add('hidden');
            
            
            playStaticSound();
            const staticEl = document.getElementById('static-overlay');
            staticEl.classList.remove('hidden');
            
            const textEl = document.getElementById('soul-text');
            textEl.classList.remove('fade-in', 'fade-out'); 
            textEl.style.opacity = "0"; 
            
            // Esperar medio segundo de estática...
            setTimeout(() => {
                staticEl.classList.add('hidden'); 
                textEl.style.opacity = "1";       
                
                // Si el alma que SIGUE es la número 6 (Determinación), disparamos lo épico
                if (currentSoulIndex === 6) { 
                    startEpicTransition();
                } else {
                    loadNextSoul();
                }
            }, 500); 
        });
// 3. LA GRAN ANIMACIÓN (PIXEL ART, ROTACIÓN Y FOTOS)
        function startEpicTransition() {
            // ==========================================
            // CONFIGURACIÓN DE TIEMPOS (AJUSTA SEGÚN TU CANCIÓN)
            // ==========================================
            const tiempoEsperaInicial = 1000; // ms de silencio antes de que aparezca el alma Celeste
            const tiempoAparicionCorazones = 2700; // ms entre cada corazón
            const tiempoParaSepararse = 3775; // ms de pausa antes de separarse
            const tiempoFotos = 275; // ms que dura cada foto
            const tiempoHastaElDrop = 17960; // ms de giro antes de que aparezca el Alma Roja
            const tiempoRojaEstatica = 1840; // <-- NUEVO: ms que el alma roja se queda quieta al aparecer
            const tiempoDeParpadeoRojo = 970; // ms parpadeando rojo antes del flash final
            // TUS FOTOS CON SHARON
           // TUS FOTOS CON SHARON
            const fotosSharon = [
            "url('1.jpg')",
            "url('2.jpg')",
            "url('3.jpg')",
            "url('4.jpg')",
            "url('5.jpg')",
            "url('6.jpg')",
            "url('7.jpg')",
            "url('8.jpg')",
            "url('9.jpg')",
            "url('10.jpg')",
            "url('11.png')",
            "url('12.png')",
            "url('13.png')",
            "url('14.png')",
            "url('15.png')",
            "url('16.png')",
            "url('17.png')",
            "url('18.png')",
            "url('19.png')",
            "url('20.png')",
            "url('21.png')",
            "url('22.png')",
            "url('23.png')",
            "url('24.png')",
            "url('25.png')",
            "url('26.png')",
            "url('27.png')",
            "url('28.png')",
            "url('29.png')",
            "url('30.png')",
            "url('31.png')",
            "url('32.png')",
            "url('33.png')",
            "url('34.png')",
            "url('35.png')",
            "url('36.png')",
            "url('37.png')",
            "url('38.png')",
            "url('39.png')",
            "url('40.png')",
            "url('41.png')",
            "url('42.png')",
            "url('43.png')",
            "url('44.png')"
            ];
            // ==========================================

            const hideEl = document.getElementById('screen-3');
            const showEl = document.getElementById('screen-epic');
            hideEl.classList.remove('active-screen');
            showEl.classList.add('active-screen');
            
            const detSoul = soulsData[6];
            changeMusic(detSoul.music); 
            
            const container = document.getElementById('epic-souls-container');
            container.innerHTML = ""; 
            
            const prevColors = ["#00ffff", "#0000ff", "#800080", "#ffa500", "#00ff00", "#ffff00"];
            const radiusSmall = 40; 
            const radiusLarge = 190; 
            
            const heartElements = [];

            // 1. DIBUJAR LOS 6 CORAZONES EN PIXEL ART
            prevColors.forEach((color, i) => {
                const heart = document.createElement('div');
                heart.className = 'absolute opacity-0 transition-all duration-1000';
                heart.style.color = color;
                heart.style.width = '30px';
                heart.style.height = '30px';
                
                heart.innerHTML = `
                    <svg viewBox="0 0 16 16" style="fill: currentColor; width: 100%; height: 100%; filter: drop-shadow(0 0 8px ${color});">
                        <path d="M 0 3 h 1 v -1 h 1 v -1 h 4 v 1 h 1 v 1 h 2 v -1 h 1 v -1 h 4 v 1 h 1 v 1 h 1 v 5 h -1 v 1 h -1 v 1 h -1 v 1 h -1 v 1 h -1 v 1 h -1 v 1 h -1 v 1 h -2 v -1 h -1 v -1 h -1 v -1 h -1 v -1 h -1 v -1 h -1 v -1 h -1 v -1 h -1 v -5 Z" />
                    </svg>`;
                
                const angle = (i * Math.PI * 2) / 6;
                const x = Math.cos(angle) * radiusSmall;
                const y = Math.sin(angle) * radiusSmall;
                
                heart.style.left = `calc(50% + ${x}px)`;
                heart.style.top = `calc(50% + ${y}px)`;
                heart.style.transform = "translate(-50%, -50%)"; 
                
                container.appendChild(heart);
                heartElements.push({ el: heart, angle: angle });
            });
            
            let delayTotal = tiempoEsperaInicial;

            // 2. HACERLOS APARECER UNO POR UNO
            for(let i=0; i<6; i++) {
                setTimeout(() => {
                    heartElements[i].el.style.opacity = "1";
                    playBlip(); 
                }, delayTotal);
                delayTotal += tiempoAparicionCorazones; 
            }
            
            // 3. SEPARARLOS Y EMPEZAR A GIRAR
            delayTotal += tiempoParaSepararse;
            let slideInterval;

            setTimeout(() => {
                container.classList.add('spin-container');
                
                heartElements.forEach(item => {
                    const x = Math.cos(item.angle) * radiusLarge;
                    const y = Math.sin(item.angle) * radiusLarge;
                    item.el.style.left = `calc(50% + ${x}px)`;
                    item.el.style.top = `calc(50% + ${y}px)`;
                    item.el.classList.add('counter-spin');
                });

                const photosEl = document.getElementById('epic-photos');
                photosEl.style.opacity = "1";
                
                let fotoIndex = 0;
                slideInterval = setInterval(() => {
                    photosEl.style.backgroundImage = fotosSharon[fotoIndex % fotosSharon.length];
                    fotoIndex++;
                }, tiempoFotos);

            }, delayTotal);

            // 4. EL CLÍMAX (APARECE EL ALMA ROJA ESTÁTICA)
            delayTotal += tiempoHastaElDrop;
            setTimeout(() => {
                clearInterval(slideInterval);
                document.getElementById('epic-photos').style.opacity = "0";
                
                const redSoul = document.getElementById('epic-red-soul');
                redSoul.classList.remove('hidden');
                // NOTA: Ya no le agregamos la clase de parpadeo aquí
                playStaticSound(); 

            }, delayTotal);

            // 4.5. EMPIEZA A PARPADEAR EL ALMA ROJA
            delayTotal += tiempoRojaEstatica;
            setTimeout(() => {
                const redSoul = document.getElementById('epic-red-soul');
                redSoul.classList.add('soul-blink'); // Ahora sí empieza a parpadear
            }, delayTotal);

            // 5. FLASH BLANCO Y TRANSICIÓN FINAL A DETERMINACIÓN
            delayTotal += tiempoDeParpadeoRojo;
            setTimeout(() => {
                const flash = document.getElementById('flash-overlay');
                flash.classList.remove('hidden');
                flash.classList.add('white-flash');
                playStaticSound(); 
                
                setTimeout(() => {
                    showEl.classList.remove('active-screen');
                    hideEl.classList.add('active-screen');
                    
                    flash.style.opacity = "0";
                    setTimeout(() => flash.classList.add('hidden'), 1000);
                    
                    loadNextSoul(); 
                }, 100); 

            }, delayTotal);
        }
       // ==========================================
        // PANTALLA 4: FINAL Y TROLEO RICKROLL
        // ==========================================
        let rickRollClicked = false;

        function startEnding() {
            // Poner la música final (puedes cambiarla por la que quieras)
            changeMusic("Last Goodbye.mp3"); 
            
            typeWriter('final-text', finalText, 60, () => {
                const giftContainer = document.getElementById('steam-gift-container');
                giftContainer.classList.remove('hidden');
                giftContainer.classList.add('flex', 'fade-in');
            });
        }

        // Detectar cuando le da clic al botón trampa
        document.getElementById('btnRickRoll').addEventListener('click', () => {
            rickRollClicked = true;
        });

        // Detectar cuando ella regresa a esta pestaña
        window.addEventListener('focus', () => {
            if (rickRollClicked) {
                const btn = document.getElementById('btnRickRoll');
                const baitMsg = document.getElementById('bait-msg');
                
                // Desaparecer el botón falso
                btn.style.display = 'none';
                
                // Mostrar el texto del bait usando el motor de Undertale
                baitMsg.classList.remove('hidden');
                typeWriter('bait-msg', "es bait, revisa tu bandeja de steam uwu", 50);
                
                // Evitar que la animación se repita si vuelve a cambiar de pestaña
                rickRollClicked = false; 
            }
        });
    </script>
